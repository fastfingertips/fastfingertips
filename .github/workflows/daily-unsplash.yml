name: Update Daily Profile Banner (Unsplash & WakaTime)

on:
  workflow_dispatch:
    inputs:
      collections:
        description: 'Unsplash Collection ID(s) or URL (optional)'
        required: false
        type: string
        default: ''
      query:
        description: 'Search query tags (fallback when collection is empty)'
        required: false
        type: string
        default: 'nature,minimal,landscape,architecture'
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC

permissions:
  contents: write

concurrency:
  group: profile-banner-update
  cancel-in-progress: true

jobs:
  generate-banner:
    name: Generate 2K Banner & Update README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run banner generator engine
        env:
          UNSPLASH_TOKEN: ${{ secrets.UNSPLASH_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          UNSPLASH_COLLECTIONS: ${{ inputs.collections || vars.UNSPLASH_COLLECTIONS || '' }}
          UNSPLASH_QUERY: ${{ inputs.query || vars.UNSPLASH_QUERY || 'nature,minimal,landscape,architecture' }}
        run: python scripts/update_unsplash.py

      - name: Sync README, publish telemetry summary, and push
        run: bash scripts/ci_sync.sh --push
